<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 가을 한 잔에 토핑 더해줘 🥄</title>

  <!-- 토핑요청 전용 OG (테스트 공유와 분리) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="내 가을 한 잔에 토핑 한 스푼 🥄" />
  <meta property="og:description" content="토핑 하나만 골라주면 우리 가을 궁합 점수가 나와요!" />
  <meta property="og:image" content="https://fall-mood.netlify.app/assets/og/og-topping-1200x630.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- OG만 보여주고 실제 앱(b-start)으로 즉시 이동. 쿼리(ownerId·baseDrink) → 해시로 전달 -->
  <script>
    (function () {
      var q = location.search.replace(/^\?/, '');
      // 같은 사이트의 앱(index)으로 이동 — 도메인 노출 통일(fall-mood)
      var app = 'index.html#b-start' + (q ? '?' + q : '');
      location.replace(app);
    })();
  </script>
  <style>
    html,body{margin:0;height:100dvh;background:#FAECE7;color:#8A6A4A;
      font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      display:flex;align-items:center;justify-content:center;}
    p{font-weight:700;font-size:15px;}
  </style>
</head>
<body>
  <p>🍂 가을 한 잔으로 이동 중…</p>
  <noscript>
    <a href="index.html#b-start">여기를 눌러 이동하세요</a>
  </noscript>
</body>
</html>
